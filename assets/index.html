<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rover Luna</title>
<style>
body{font:16px system-ui,sans-serif;background:#10181f;color:#eef5f6;max-width:960px;margin:auto;padding:24px}
section{background:#1c2a33;padding:20px;border-radius:12px;margin:14px 0}
h1,h2{margin-top:0} label{display:block;margin:12px 0} button,input{font:inherit}
button{padding:8px 12px;margin:4px;border:0;border-radius:6px;background:#a4e7ce;color:#102820;cursor:pointer}
button:disabled{opacity:.5} img{display:block;max-width:100%;max-height:520px;margin-top:12px}
img:not([src]){display:none} output{display:block;margin:10px 0;white-space:pre-wrap}
.nav-grid{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:14px;margin-top:14px}
.nav-view{min-width:0;background:#10181f;border:1px solid #3b5661;border-radius:10px;padding:12px}
.nav-view h3{margin:0 0 8px;font-size:.9rem}
.nav-status{margin:0 0 9px;font:600 .8rem system-ui,sans-serif;color:#b9d3dd}
.nav-status[data-state="valid"]{color:#a4e7ce}
.nav-status[data-state="stale"],.nav-status[data-state="tentative"]{color:#ffd086}
.nav-stage{position:relative;width:fit-content;max-width:100%;margin:auto}
.nav-stage img,.nav-view>img{margin:0 auto;border-radius:5px}
.rover-point{position:absolute;transform:translate(-50%,-50%);width:19px;height:19px;border:2px solid #fff;
    border-radius:50%;background:#25af91;color:#d0fff3;box-shadow:0 0 0 5px #0b2d2bd9;pointer-events:none}
.rover-point[data-state="stale"],.rover-point[data-state="tentative"]{background:#b27931;color:#ffe2a8;box-shadow:0 0 0 5px #38250ad9}
.rover-heading{position:absolute;inset:0;border-radius:50%}
.rover-heading::before{content:"";position:absolute;top:-15px;left:50%;transform:translateX(-50%);
    border:7px solid transparent;border-bottom:13px solid currentColor;border-top:0;filter:drop-shadow(0 1px 1px #000)}
[hidden]{display:none!important}
@media(max-width:670px){.nav-grid{grid-template-columns:minmax(0,1fr)}}
</style>
<h1>Rover Luna</h1>
<section>
<h2>Map and camera</h2>
<label>Reference map <input id="mapFile" type="file" accept="image/jpeg,image/png"></label>
<button id="download">Download reference map</button>
<label>Upload camera frame <input id="frameFile" type="file" accept="image/jpeg,image/png"></label>
<label><input id="correctColors" type="checkbox" checked> Correct camera colors</label>
<button id="capture">Take photo</button>
<button id="match">Find position on map</button>
<button id="landing">Run landing test (5 s capture)</button>
<button id="live">Start live tracking</button>
<output id="visionStatus" aria-live="polite"></output>
<img id="framePreview" alt="Latest camera frame">
<img id="mapPreview" alt="Reference map with the matched camera outline">
<div id="liveNavigation" class="nav-grid" hidden>
  <div class="nav-view">
    <h3>Rover position</h3>
    <output id="poseStatus" class="nav-status">Waiting for the camera…</output>
    <output id="heightStatus" class="nav-status">Height · Waiting for a pose</output>
    <label>Measured starting height (m) <input id="initialHeight" type="number" min="0.001" step="any" placeholder="0.75"></label>
    <button id="setHeight">Set IMU starting height</button>
    <output id="heightSetupStatus" class="nav-status" aria-live="polite"></output>
    <div class="nav-stage">
      <img id="navMap" alt="Reference map">
      <div id="roverPoint" class="rover-point" hidden><span id="roverHeading" class="rover-heading"></span></div>
    </div>
  </div>
  <div class="nav-view">
    <h3>Rover camera</h3>
    <img id="navFrame" alt="Latest rover camera frame">
  </div>
</div>
</section>
<section>
<h2>Lander status</h2>
<button id="armLander" disabled>Arm landing detection manually</button>
<output id="landerStatus" aria-live="polite">Waiting for the IMU…</output>
<button id="calibrateImu">Calibrate IMU while stationary</button>
<output id="imuStatus" aria-live="polite"></output>
</section>
<script>
const get = id => document.getElementById(id);
let reference, frame;
let visionBusy = false;
let liveActive = false;
const CAMERA_WAIT_MS = 12000;
const CAMERA_UNAVAILABLE = "The Uno Q camera did not respond. Check whether another app is using it.";
const diagnosticTranslations = [
    ["Usa una foto JPG o PNG entro 12 MB.", "Use a JPG or PNG image up to 12 MB."],
    ["Immagine illeggibile. Usa JPG o PNG.", "Could not decode the image. Use JPG or PNG."],
    [/La camera non ha restituito (?:un fotogramma|fotogrammi)\./, "The camera returned no frames."],
    ["Imposta MAP_URL in python/main.py, oppure carica una foto.", "Set MAP_URL in python/main.py or upload a reference image."],
    [/Impossibile creare (?:la mappa|l'immagine) del risultato\./, "Could not create the result image."],
    ["Impossibile ricodificare la mappa.", "Could not encode the reference map."],
    ["Impossibile codificare il fotogramma della camera.", "Could not encode the camera frame."],
    ["Sessione live terminata.", "Live tracking session ended."],
    ["Contrasto locale:", "Enhanced contrast:"],
    ["Dettagli insufficienti.", "Too little image detail."],
    [/Punti rilevati: fotogramma (\d+), mappa (\d+)\./g, "Detected features: $1 in the frame, $2 in the map."],
    [/Solo (\d+\/\d+) corrispondenze distinte\./g, "Only $1 distinct matches."],
    ["Nessuna trasformazione coerente.", "Could not find a consistent match."],
    [/Match incerto \((\d+\/\d+) punti coerenti\)\./g, "Uncertain match ($1 inliers)."],
    ["Proiezione non valida.", "Invalid projection."],
    ["Il contorno stimato non è plausibile.", "The projected camera outline is implausible."],
    ["Il centro stimato è fuori dalla mappa.", "The projected position is outside the reference map."],
];

function englishDiagnostic(message) {
    if (typeof message !== "string") return "";
    if (/La camera .? ?occupata\.|Failed to open camera|Device or resource busy/i.test(message)) return CAMERA_UNAVAILABLE;
    for (const [from, to] of diagnosticTranslations) {
        message = typeof from === "string" ? message.replaceAll(from, to) : message.replace(from, to);
    }
    return message;
}

async function post(path, data) {
    const onCamera = /^\/(?:capture|landing|live\/)/.test(path);
    const signal = AbortSignal.timeout(path.startsWith("/landing") ? 25000 : CAMERA_WAIT_MS);
    try {
        const response = await fetch(path, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: data === undefined ? undefined : JSON.stringify(data),
            signal,
        });
        const result = await response.json();
        if (!response.ok) throw new Error(englishDiagnostic(result.error) || "HTTP error " + response.status);
        return result;
    } catch (error) {
        if (signal.aborted) {
            throw new Error(onCamera ? CAMERA_UNAVAILABLE : "The Uno Q did not respond. Try again.");
        }
        throw error;
    }
}
function readPhoto(file) {
    return new Promise((resolve, reject) => {
        if (file.size > 12 * 1024 * 1024) return reject(new Error("The image exceeds 12 MB."));
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error("Could not read the image."));
        reader.readAsDataURL(file);
    });
}
async function vision(action, busyMessage = "Processing…") {
    if (visionBusy) return;
    visionBusy = true;
    const controls = ["mapFile", "frameFile", "download", "capture", "match", "landing", "correctColors", "live"].map(get);
    controls.forEach(control => control.disabled = true);
    get("visionStatus").textContent = busyMessage;
    try {
        get("visionStatus").textContent = await action();
    } catch (error) {
        if (reference) get("mapPreview").src = reference;
        get("visionStatus").textContent = error.message;
    } finally {
        controls.forEach(control => control.disabled = false);
        visionBusy = false;
    }
}
function showMap(image) {
    reference = image;
    get("mapPreview").src = image;
    return "Reference map ready.";
}
function showFrame(image) {
    frame = image;
    get("framePreview").src = image;
    if (reference) get("mapPreview").src = reference;
    return "Camera frame ready.";
}
get("mapFile").onchange = event => {
    const file = event.target.files[0];
    if (file) vision(async () => showMap(await readPhoto(file)));
};
get("frameFile").onchange = event => {
    const file = event.target.files[0];
    if (file) vision(async () => showFrame(await readPhoto(file)));
};
get("capture").onclick = () => vision(async () => {
    const result = await post("/capture?correct_colors=" + get("correctColors").checked);
    return showFrame(result.frame);
}, "Opening the camera and taking a photo…");
get("download").onclick = () => vision(async () => showMap((await post("/map")).map));
get("match").onclick = () => vision(async () => {
    if (!reference || !frame) throw new Error("Choose a reference map and capture or upload a camera frame.");
    const result = await post("/match", {map: reference.split(",")[1], frame: frame.split(",")[1]});
    get("mapPreview").src = result.overlay;
    return (result.tentative ? "Tentative position. Center: " : "Position on map: ") + result.x + ", " + result.y + " px · Camera heading: " +
        result.angle + "° · Matching inliers: " + result.inliers + "/" + result.matches;
});
get("landing").onclick = () => vision(async () => {
    if (!reference) throw new Error("Upload a reference map first.");
    get("visionStatus").textContent = "Capturing descent. Hold the camera still for the final two seconds.";
    get("mapPreview").src = reference;
    const result = await post("/landing?correct_colors=" + get("correctColors").checked, {map: reference.split(",")[1]});
    showFrame(result.frame);
    const counts = result.valid + " valid late matches from " + result.total + " captured frames.";
    if (!result.confirmed && !result.overlay) {
        return ["No reliable position estimate. " + counts, ...(result.diagnostics ?? []).map(englishDiagnostic)].join("\n");
    }
    if (!result.confirmed) {
        get("mapPreview").src = result.overlay;
        return "Tentative position at " + result.timestamp + " s. Center: " + result.x + ", " +
            result.y + " px. Matching inliers: " + result.inliers + "/" + result.matches + ".";
    }
    get("mapPreview").src = result.overlay;
    return "Center: " + result.x + ", " + result.y + " px. Heading: " + result.angle + "°. " + counts;
});
const pause = ms => new Promise(resolve => setTimeout(resolve, ms));
function showPose(pose) {
    const marker = get("roverPoint");
    const heading = get("roverHeading");
    const status = get("poseStatus");
    const state = pose?.tracking_status ?? "waiting";
    status.dataset.state = marker.dataset.state = state;
    const height = get("heightStatus");
    if (pose?.z_m != null) {
        const heightLabel = {
            camera: "Camera height",
            initial: "Measured starting height",
            imu: "IMU estimated height",
            last_imu: "Last IMU height",
            last_initial: "Last measured starting height",
            last_camera: "Last camera height"
        }[pose.height_source];
        height.textContent = heightLabel + " · " + pose.z_m.toFixed(3) + " m above map" +
            (pose.height_source.startsWith("last_") ?
                " · " + (pose.height_estimate_age_ms / 1000).toFixed(1) + " s ago" : "");
    } else {
        height.textContent = "Height · " + (pose?.height_calibrated === false ?
            "Map scale and camera calibration required" : "Waiting for a reliable height estimate");
    }
    const map = get("navMap");
    marker.hidden = pose?.x_norm == null || pose.y_norm == null || !map.naturalWidth;
    if (marker.hidden) {
        status.textContent = "Waiting for a camera position…";
        return;
    }
    marker.style.left = 100 * pose.x_norm + "%";
    marker.style.top = 100 * pose.y_norm + "%";
    heading.hidden = pose.heading_deg === null;
    heading.style.transform = heading.hidden ? "" : "rotate(" + pose.heading_deg + "deg)";
    const label = {
        valid: "Live position",
        tentative: "Tentative position",
        stale: "Last known position"
    }[state];
    const source = pose.heading_source === "camera_imu" ?
        (state === "stale" ? "IMU heading" : "Camera + IMU heading") : "Camera heading";
    status.textContent = label + " · X " + pose.x_norm.toFixed(4) + " · Y " + pose.y_norm.toFixed(4) +
        (state === "stale" ? " · " + (pose.frame_age_ms / 1000).toFixed(1) + " s ago" : "") +
        (heading.hidden ? "" : " · " + source + " " + pose.heading_deg + "°");
}
get("setHeight").onclick = async () => {
    const button = get("setHeight");
    const status = get("heightSetupStatus");
    button.disabled = true;
    try {
        await post("/live/height", {height_m: get("initialHeight").valueAsNumber});
        status.textContent = "";
    } catch (error) {
        status.textContent = error.message;
    } finally {
        button.disabled = false;
    }
};
async function livePreview() {
    const start = performance.now();
    let receivedFrame = false;
    while (liveActive) {
        const result = await post("/live/preview");
        if (!liveActive) return;
        showPose(result.pose);
        if (result.frame) {
            receivedFrame = true;
            frame = result.frame;
            get("framePreview").src = frame;
            get("navFrame").src = frame;
        } else if (!receivedFrame && performance.now() - start >= CAMERA_WAIT_MS) {
            throw new Error(CAMERA_UNAVAILABLE);
        }
        await pause(180);
    }
}
async function livePosition() {
    while (liveActive) {
        const result = await post("/live/match");
        if (!liveActive) return;
        if (result.overlay) {
            get("mapPreview").src = result.overlay;
            const method = result.mode === "tracking" ? "Optical flow" : "Map match";
            get("visionStatus").textContent = method + " · " + result.seconds + " s";
        } else if (!result.waiting) {
            get("visionStatus").textContent = englishDiagnostic(result.diagnostic);
        }
        await pause(250);
    }
}
get("live").onclick = () => {
    if (liveActive) {
        liveActive = false;
        get("live").disabled = true;
        return;
    }
    vision(async () => {
        if (!reference) throw new Error("Upload a reference map first.");
        await post("/live/start?correct_colors=" + get("correctColors").checked,
            {map: reference.split(",")[1]});
        liveActive = true;
        get("mapPreview").src = reference;
        get("navMap").src = reference;
        get("navFrame").removeAttribute("src");
        get("liveNavigation").hidden = false;
        get("heightSetupStatus").textContent = "";
        get("framePreview").hidden = get("mapPreview").hidden = true;
        showPose(null);
        get("live").textContent = "Stop live tracking";
        get("live").disabled = false;
        get("visionStatus").textContent = "";
        try {
            await Promise.race([livePreview(), livePosition()]);
            return "Live tracking stopped.";
        } finally {
            liveActive = false;
            get("live").textContent = "Start live tracking";
            get("liveNavigation").hidden = true;
            get("framePreview").hidden = get("mapPreview").hidden = false;
            await post("/live/stop");
        }
    });
};
window.addEventListener("pagehide", () => {
    if (liveActive) navigator.sendBeacon("/live/stop");
});
async function refreshImu() {
    try {
        const result = await post("/imu");
        const status = result.status === "ready" ?
            "Roll " + result.roll + "° · Pitch " + result.pitch + "° · Relative yaw " +
            result.yaw + "° · Acceleration " + result.acceleration + " m/s²" :
            result.status === "unavailable" ? "Waiting for the Modulino Movement to respond on I²C." :
            result.status === "stale" ? "IMU readings are stale." :
            "Keep the rover still while the IMU calibrates (" + (result.samples || 0) + "/40).";
        get("imuStatus").textContent = status;
        get("armLander").disabled = result.status !== "ready" || result.lander_status === "in_air";
        get("landerStatus").textContent = result.status === "ready" ?
            {ready: "Ready · Waiting for motion", in_air: "In air", landed: "Landed"}[result.lander_status] :
            "Waiting for the IMU…";
    } catch (error) {
        get("imuStatus").textContent = error.message;
        get("armLander").disabled = true;
    }
}
get("calibrateImu").onclick = async () => {
    await post("/imu/calibrate");
    await refreshImu();
};
refreshImu();
setInterval(refreshImu, 350);
get("armLander").onclick = async () => {
    get("armLander").disabled = true;
    try {
        await post("/lander/arm");
        await refreshImu();
    } catch (error) {
        get("landerStatus").textContent = error.message;
    }
};
</script>
</html>
